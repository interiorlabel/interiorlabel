<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELEASES — INTERIØR</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
    @font-face {
        font-family: 'Adobe Garamond Pro';
        src: local('Adobe Garamond Pro'),
             local('AGaramondPro-Regular'),
             url('FONTS/AGaramondPro-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Adobe Garamond Pro', 'Garamond', 'EB Garamond', serif;
    }

    /* ---------- Glitch intro overlay ---------- */
    #glitch-screen {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 100;
    }
    #glitch-screen::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(255,255,255,0.03) 2px,
            rgba(255,255,255,0.03) 4px
        );
        pointer-events: none;
        z-index: 2;
    }
    #glitch-bg {
        position: absolute;
        inset: 0;
        background: #000;
    }
    #glitch-bars {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 3;
    }
    .bar {
        position: absolute;
        left: 0; right: 0;
        background: #fff;
    }

    /* ---------- Page content (revealed after glitch) ---------- */
    .page {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
        padding: 60px 40px 100px;
        color: #b9b9b9;
    }

    .title {
        font-size: 17px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e4e4e4;
    }

    .list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
    }
    .list a {
        color: #d8d8d8;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 0.04em;
        transition: color 0.2s ease, opacity 0.2s ease;
    }
    .list a:hover {
        color: #ffffff;
        opacity: 0.85;
    }

    .symbol {
        position: fixed;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
    }
    .symbol svg {
        width: 44px;
        height: 44px;
        stroke: #6a6a6a;
    }
    .symbol a {
        display: block;
        transition: opacity 0.2s ease;
    }
    .symbol a:hover {
        opacity: 0.7;
    }

    @media (max-width: 720px) {
        .page { padding: 40px 24px 100px; gap: 44px; }
        .title { font-size: 16px; }
        .list a { font-size: 14px; }
        .list { gap: 32px; }
        .symbol svg { width: 36px; height: 36px; }
    }
    </style>
</head>
<body>

    <div id="glitch-screen">
        <div id="glitch-bg"></div>
        <div id="glitch-bars"></div>
    </div>

    <div class="page" id="page">

        <div class="title">Releases</div>

        <div class="list">
            <a href="int291.html">INT291</a>
            <a href="https://interiorr.bandcamp.com/" target="_blank">INT292</a>
        </div>

        <div class="symbol">
            <a href="index.html" aria-label="Home">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="96" height="96" stroke-width="1"/>
                    <line x1="2" y1="2" x2="41" y2="41" stroke-width="1"/>
                    <line x1="98" y1="2" x2="59" y2="41" stroke-width="1"/>
                    <line x1="2" y1="98" x2="41" y2="59" stroke-width="1"/>
                    <line x1="98" y1="98" x2="59" y2="59" stroke-width="1"/>
                    <line x1="50" y1="2" x2="50" y2="41" stroke-width="1"/>
                    <line x1="50" y1="59" x2="50" y2="98" stroke-width="1"/>
                </svg>
            </a>
        </div>

    </div>

    <script>
        const glitchScreen = document.getElementById('glitch-screen');
        const bg           = document.getElementById('glitch-bg');
        const barsEl       = document.getElementById('glitch-bars');
        const page         = document.getElementById('page');

        const rand  = (a, b) => Math.random() * (b - a) + a;
        const randI = (a, b) => Math.floor(rand(a, b));
        const wait  = ms => new Promise(r => setTimeout(r, ms));

        function flashBg(color, duration) {
            bg.style.background = color;
            return wait(duration).then(() => { bg.style.background = '#000'; });
        }

        function spawnBars(count) {
            barsEl.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                const h = rand(2, 35);
                const t = rand(0, 100 - h);
                bar.style.cssText = `top:${t}%;height:${h}%;opacity:${rand(0.4,1)};`;
                barsEl.appendChild(bar);
                setTimeout(() => bar.remove(), rand(30, 120));
            }
        }

        async function runGlitch() {
            for (let i = 0; i < 7; i++) {
                await flashBg(i % 2 === 0 ? '#fff' : '#000', randI(30, 100));
                spawnBars(randI(2, 6));
                await wait(randI(15, 50));
            }

            for (let i = 0; i < 8; i++) {
                bg.style.background = Math.random() > 0.5 ? '#fff' : '#000';
                spawnBars(randI(3, 8));
                await wait(randI(20, 60));
            }

            bg.style.background = '#fff';
            await wait(50);
            bg.style.background = '#000';
            await wait(80);

            glitchScreen.style.transition = 'opacity 0.3s ease';
            page.style.transition         = 'opacity 0.3s ease';
            page.style.pointerEvents      = 'auto';
            glitchScreen.style.opacity    = '0';
            page.style.opacity            = '1';

            await wait(300);
            glitchScreen.remove();
        }

        runGlitch();
    </script>
</body>
</html>
