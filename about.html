<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT — INTERIØR</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
    @font-face {
        font-family: 'Adobe Garamond Pro';
        src: local('Adobe Garamond Pro'),
             local('AGaramondPro-Regular'),
             url('FONTS/AGaramondPro-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        background: #000;
    }

    body {
        color: #b9b9b9;
        font-family: 'Adobe Garamond Pro', 'Garamond', 'EB Garamond', serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 60px 40px 100px;
        opacity: 0;
        animation: fadeIn 0.9s ease-out forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .title {
        font-size: 22px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e4e4e4;
    }

    .photo {
        width: 230px;
        max-width: 70vw;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        border: 1px solid #2a2a2a;
    }
    .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: grayscale(1) contrast(1.05);
    }

    .copy {
        max-width: 42ch;
        text-align: center;
        font-size: 16px;
        line-height: 1.6;
        color: #cfcfcf;
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .symbol {
        position: fixed;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
    }
    .symbol svg {
        width: 44px;
        height: 44px;
        stroke: #6a6a6a;
    }
    .symbol a {
        display: block;
        transition: opacity 0.2s ease;
    }
    .symbol a:hover {
        opacity: 0.7;
    }

    @media (max-width: 720px) {
        body { padding: 40px 24px 100px; gap: 32px; }
        .title { font-size: 19px; }
        .copy { font-size: 15px; }
    }
    </style>
</head>
<body>

    <div class="title">About</div>

    <div class="photo">
        <img src="aboutimage.jpg" alt="">
    </div>

    <div class="copy">
        <p>Record label focused on foward-thinking electronic music.</p>
        <p>Founded in 2025 by Protocol</p>
    </div>

    <div class="symbol">
        <a href="index.html" aria-label="Home">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="96" height="96" stroke-width="1"/>
                <line x1="2" y1="2" x2="41" y2="41" stroke-width="1"/>
                <line x1="98" y1="2" x2="59" y2="41" stroke-width="1"/>
                <line x1="2" y1="98" x2="41" y2="59" stroke-width="1"/>
                <line x1="98" y1="98" x2="59" y2="59" stroke-width="1"/>
                <line x1="50" y1="2" x2="50" y2="41" stroke-width="1"/>
                <line x1="50" y1="59" x2="50" y2="98" stroke-width="1"/>
            </svg>
        </a>
    </div>

</body>
</html>
