<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READ — INTERIØR</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
    @font-face {
        font-family: 'Adobe Garamond Pro';
        src: local('Adobe Garamond Pro'),
             local('AGaramondPro-Regular'),
             url('FONTS/AGaramondPro-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Adobe Garamond Pro', 'Garamond', 'EB Garamond', serif;
    }

    .page {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
        padding: 60px 40px 100px;
        color: #b9b9b9;
        opacity: 0;
        animation: fadeIn 0.9s ease-out forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .title {
        font-size: 17px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e4e4e4;
    }

    .list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
    }
    .list a {
        color: #d8d8d8;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: color 0.2s ease, opacity 0.2s ease;
    }
    .list a:hover {
        color: #ffffff;
        opacity: 0.85;
    }

    .list-inactive {
        color: #4a4a4a;
        font-size: 15px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: default;
        pointer-events: none;
    }

    .symbol {
        position: fixed;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
    }
    .symbol svg {
        width: 44px;
        height: 44px;
        stroke: #6a6a6a;
    }
    .symbol a {
        display: block;
        transition: opacity 0.2s ease;
    }
    .symbol a:hover {
        opacity: 0.7;
    }

    @media (max-width: 720px) {
        .page { padding: 40px 24px 100px; gap: 44px; }
        .title { font-size: 16px; }
        .list a { font-size: 14px; }
        .list-inactive { font-size: 14px; }
        .list { gap: 32px; }
        .symbol svg { width: 36px; height: 36px; }
    }
    </style>
</head>
<body>

    <div class="page">

        <div class="title">Read</div>

        <div class="list">
            <a href="newsletter.html">Newsletter</a>
            <a href="essays.html">Essays</a>
        </div>

        <div class="symbol">
            <a href="index.html" aria-label="Home">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="96" height="96" stroke-width="1"/>
                    <line x1="2" y1="2" x2="41" y2="41" stroke-width="1"/>
                    <line x1="98" y1="2" x2="59" y2="41" stroke-width="1"/>
                    <line x1="2" y1="98" x2="41" y2="59" stroke-width="1"/>
                    <line x1="98" y1="98" x2="59" y2="59" stroke-width="1"/>
                    <line x1="50" y1="2" x2="50" y2="41" stroke-width="1"/>
                    <line x1="50" y1="59" x2="50" y2="98" stroke-width="1"/>
                </svg>
            </a>
        </div>

    </div>

</body>
</html>
