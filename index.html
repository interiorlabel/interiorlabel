<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERIØR</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
    @font-face {
        font-family: 'Adobe Garamond Pro';
        src: local('Adobe Garamond Pro'),
             local('AGaramondPro-Regular'),
             url('FONTS/AGaramondPro-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        background: #000;
    }

    body {
        color: #b9b9b9;
        font-family: 'Adobe Garamond Pro', 'Garamond', 'EB Garamond', serif;
        min-height: 100vh;
        overflow: hidden;
    }

    /* ---------- Intro symbol ---------- */
    .intro {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        pointer-events: none;
    }
    .intro svg {
        width: 90px;
        height: 90px;
        stroke: #b9b9b9;
        overflow: visible;
        animation: introOut 1.2s ease-in forwards;
        animation-delay: 2.6s;
    }
    .intro svg .seg {
        stroke-dasharray: var(--len);
        stroke-dashoffset: var(--len);
        animation: draw 1s ease-out forwards;
        animation-delay: var(--d);
    }
    @keyframes draw {
        to { stroke-dashoffset: 0; }
    }
    @keyframes introOut {
        0%   { opacity: 1; }
        100% { opacity: 0; }
    }

    /* ---------- Main menu ---------- */
    .menu-wrap {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
        opacity: 0;
        animation: menuIn 1.2s ease-out forwards;
        animation-delay: 3.8s;
    }
    @keyframes menuIn {
        0%   { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .menu-wrap a {
        color: #d8d8d8;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-align: center;
        transition: color 0.2s ease, opacity 0.2s ease;
    }
    .menu-wrap a:hover {
        color: #ffffff;
        opacity: 0.85;
    }

    .menu-symbol {
        position: absolute;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
    }
    .menu-symbol svg {
        width: 44px;
        height: 44px;
        stroke: #6a6a6a;
        overflow: visible;
    }
    .menu-symbol a { display: block; }
    .menu-symbol .seg {
        stroke-dasharray: var(--len);
        stroke-dashoffset: var(--len);
        animation: draw 0.7s ease-out forwards;
        animation-delay: calc(4.1s + var(--d));
    }

    @media (max-width: 720px) {
        .menu-wrap a { font-size: 14px; }
        .intro svg { width: 70px; height: 70px; }
        .menu-symbol svg { width: 36px; height: 36px; }
    }
    </style>
</head>
<body>

    <!-- Intro symbol: fades away after load -->
    <div class="intro" id="intro">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect class="seg" x="2" y="2" width="96" height="96" stroke-width="1" style="--len:384; --d:0s"/>
            <line class="seg" x1="2" y1="2" x2="41" y2="41" stroke-width="1" style="--len:55; --d:0.5s"/>
            <line class="seg" x1="98" y1="2" x2="59" y2="41" stroke-width="1" style="--len:55; --d:0.65s"/>
            <line class="seg" x1="2" y1="98" x2="41" y2="59" stroke-width="1" style="--len:55; --d:0.65s"/>
            <line class="seg" x1="98" y1="98" x2="59" y2="59" stroke-width="1" style="--len:55; --d:0.5s"/>
            <line class="seg" x1="50" y1="2" x2="50" y2="41" stroke-width="1" style="--len:39; --d:0.9s"/>
            <line class="seg" x1="50" y1="59" x2="50" y2="98" stroke-width="1" style="--len:39; --d:0.9s"/>
        </svg>
    </div>

    <!-- Main menu -->
    <div class="menu-wrap" id="menu">
        <a href="about.html">About</a>
        <a href="releases.html">Releases</a>
        <a href="https://soundcloud.com/interiorlabel" target="_blank">Mixtapes</a>
        <a href="read.html">Read</a>

        <div class="menu-symbol">
            <a href="index.html" aria-label="Home">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect class="seg" x="2" y="2" width="96" height="96" stroke-width="1" style="--len:384; --d:0s"/>
                    <line class="seg" x1="2" y1="2" x2="41" y2="41" stroke-width="1" style="--len:55; --d:0.15s"/>
                    <line class="seg" x1="98" y1="2" x2="59" y2="41" stroke-width="1" style="--len:55; --d:0.2s"/>
                    <line class="seg" x1="2" y1="98" x2="41" y2="59" stroke-width="1" style="--len:55; --d:0.2s"/>
                    <line class="seg" x1="98" y1="98" x2="59" y2="59" stroke-width="1" style="--len:55; --d:0.15s"/>
                    <line class="seg" x1="50" y1="2" x2="50" y2="41" stroke-width="1" style="--len:39; --d:0.3s"/>
                    <line class="seg" x1="50" y1="59" x2="50" y2="98" stroke-width="1" style="--len:39; --d:0.3s"/>
                </svg>
            </a>
        </div>
    </div>

    <script>
        // Remove the intro from the DOM once its fade-out finishes,
        // so it doesn't block clicks on the menu underneath.
        const intro = document.getElementById('intro');
        const introSvg = intro.querySelector('svg');
        introSvg.addEventListener('animationend', (e) => {
            if (e.animationName === 'introOut') {
                intro.style.display = 'none';
            }
        });

    </script>
</body>
</html>
